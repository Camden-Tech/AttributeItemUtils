name: AttributeItemUtils
author: BaddCamdne
main: com.baddcamdne.attributeitemutils.AttributeItemUtilsPlugin
version: 1.0.0-SNAPSHOT
depend: [AttributeUtils]
api-version: 1.21
commands:
  aiukit:
    description: Apply a configured kit to a player with optional weight overrides.
    usage: /aiukit <kit> [player] [targetWeight] [steepness] [range]
    permission: attributeitemutils.test.kit
  aiuattributes:
    description: Apply attribute rolls to the item in a specific slot.
    usage: /aiuattributes <slot> <nights> [default|baseChance nightlyIncrease bonusPercent maxChance]
    permission: attributeitemutils.test.attributes
  aiuenchants:
    description: Apply enchantment rolls to the item in a specific slot.
    usage: /aiuenchants <slot> <nights> [default|baseChance nightlyIncrease levelBonus maxChance]
    permission: attributeitemutils.test.enchants
  aiutestspawn:
    description: Spawn a test mob with a configured kit applied.
    usage: /aiutestspawn <entityType> <kit> [targetWeight] [steepness] [range]
    permission: attributeitemutils.test.spawn
permissions:
  attributeitemutils.test.*:
    description: Access to all AttributeItemUtils test commands.
    children:
      attributeitemutils.test.kit: true
      attributeitemutils.test.attributes: true
      attributeitemutils.test.enchants: true
      attributeitemutils.test.spawn: true
  attributeitemutils.test.kit:
    description: Permission to apply test kits.
    default: op
  attributeitemutils.test.attributes:
    description: Permission to apply attribute rolls via command.
    default: op
  attributeitemutils.test.enchants:
    description: Permission to apply enchant rolls via command.
    default: op
  attributeitemutils.test.spawn:
    description: Permission to spawn test entities with kits.
    default: op
