# Default attribute utility configuration

# Debug logging toggles
debug:
  # When true, every computed attribute refresh logs the vanilla base, computed totals, and AttributeUtils modifiers
  # found before/after purge. Useful for diagnosing stacked/compounding modifiers.
  log-computed-modifiers: true
  # When true, attribute refresh dispatching logs queued and flushed targets to track how often refreshes fire.
  log-refresh-flushes: true

# Vanilla attribute defaults
# Each entry seeds both the global and player baselines for the built-in
# attributes listed below. Values are mirrored to base/current by default;
# per-stage customization can be added later if needed. Vanilla dynamic
# attributes are limited to attack-damage, attack-speed, attack-knockback,
# armor, armor-toughness, and knockback-resistance; the rest sync their
# current baseline from the static default baseline.
vanilla-attribute-defaults:
  generic.max-health:
    bukkit-attributes: [MAX_HEALTH, GENERIC_MAX_HEALTH]
    default-base: 20
  generic.follow-range:
    bukkit-attributes: [FOLLOW_RANGE, GENERIC_FOLLOW_RANGE]
    default-base: 32
  generic.attack-damage:
    bukkit-attributes: [ATTACK_DAMAGE, GENERIC_ATTACK_DAMAGE]
    default-base: 1
  generic.attack-knockback:
    bukkit-attributes: [ATTACK_KNOCKBACK, GENERIC_ATTACK_KNOCKBACK]
    default-base: 0
  generic.attack-speed:
    bukkit-attributes: [ATTACK_SPEED, GENERIC_ATTACK_SPEED]
    default-base: 4
  generic.movement-speed:
    bukkit-attributes: [MOVEMENT_SPEED, GENERIC_MOVEMENT_SPEED]
    default-base: 0.1
    dynamic: true
  generic.flying-speed:
    bukkit-attributes: [FLYING_SPEED, GENERIC_FLYING_SPEED]
    default-base: 0.4
  generic.armor:
    bukkit-attributes: [ARMOR, GENERIC_ARMOR]
    default-base: 0
  generic.armor-toughness:
    bukkit-attributes: [ARMOR_TOUGHNESS, GENERIC_ARMOR_TOUGHNESS]
    default-base: 0
  generic.luck:
    bukkit-attributes: [LUCK, GENERIC_LUCK]
    default-base: 0
  generic.knockback-resistance:
    bukkit-attributes: [KNOCKBACK_RESISTANCE, GENERIC_KNOCKBACK_RESISTANCE]
    default-base: 0
  generic.block-interaction-range:
    bukkit-attributes: [BLOCK_INTERACTION_RANGE]
    default-base: 5
  generic.entity-interaction-range:
    bukkit-attributes: [ENTITY_INTERACTION_RANGE]
    default-base: 3
  generic.block-break-speed:
    bukkit-attributes: [BLOCK_BREAK_SPEED]
    default-base: 1
  generic.mining-efficiency:
    bukkit-attributes: [MINING_EFFICIENCY]
    default-base: 1
  generic.gravity:
    bukkit-attributes: [GRAVITY, GENERIC_GRAVITY]
    default-base: 1
    dynamic: true
  generic.scale:
    bukkit-attributes: [SCALE, GENERIC_SCALE]
    default-base: 1
  generic.step-height:
    bukkit-attributes: [STEP_HEIGHT, GENERIC_STEP_HEIGHT]
    default-base: 0.6
  generic.safe-fall-distance:
    bukkit-attributes: [SAFE_FALL_DISTANCE, GENERIC_SAFE_FALL_DISTANCE]
    default-base: 3
  generic.fall-damage-multiplier:
    bukkit-attributes: [FALL_DAMAGE_MULTIPLIER, GENERIC_FALL_DAMAGE_MULTIPLIER]
    default-base: 1
  generic.jump-strength:
    bukkit-attributes: [JUMP_STRENGTH, GENERIC_JUMP_STRENGTH]
    default-base: 0.42
    dynamic: true
  generic.sneaking-speed:
    bukkit-attributes: [SNEAKING_SPEED, PLAYER_SNEAKING_SPEED]
    default-base: 1
  generic.movement-efficiency:
    bukkit-attributes: [MOVEMENT_EFFICIENCY]
    default-base: 1
  generic.water-movement-efficiency:
    bukkit-attributes: [WATER_MOVEMENT_EFFICIENCY]
    default-base: 1
  generic.explosion-knockback-resistance:
    bukkit-attributes: [EXPLOSION_KNOCKBACK_RESISTANCE]
    default-base: 0

# Global caps for core attributes
# Caps can be supplied as a scalar (max only) or a section with `min`,
# `max`, and optional `overrides:` map entries for keyed caps.
global-attribute-caps:
  generic.max-health: 100
  generic.follow-range: 256
  generic.attack-damage: 100
  generic.attack-knockback: 10
  generic.attack-speed: 40
  generic.movement-speed: 1
  generic.flying-speed: 1
  generic.armor: 40
  generic.armor-toughness: 20
  generic.luck: 1024
  generic.knockback-resistance: 1
  generic.block-interaction-range: 128
  generic.entity-interaction-range: 64
  generic.block-break-speed: 1024
  generic.mining-efficiency: 1024
  generic.gravity: 10
  generic.scale: 10
  generic.step-height: 5
  generic.safe-fall-distance: 256
  generic.fall-damage-multiplier: 10
  generic.jump-strength: 5
  generic.sneaking-speed: 4
  generic.movement-efficiency: 4
  generic.water-movement-efficiency: 4
  generic.explosion-knockback-resistance: 1

# Sample custom attributes
custom-attribute-defaults:
  example.maxmana:
    display: "Max Mana"
    default-base: 100
    default-current: 100
    dynamic: false
    min: 0
    max: 250

# Custom attribute loading
load-custom-attributes-from-folder: true
custom-attributes-folder: custom-attributes

entity-command:
  disallowed-entities:
    - PLAYER

